<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Establish Network | AfroSINT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
</head>
<body class="bg-[#0a0a0a] min-h-screen py-10 px-4">
    <div class="watermark-bg"></div>

    <div class="max-w-3xl mx-auto">
        <div class="flex items-center gap-4 mb-8">
            <a href="networks.html" class="text-[#00E5FF] hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </a>
            <h1 class="text-3xl font-bold text-white uppercase tracking-widest">Network Setup Wizard</h1>
        </div>

        <form id="networkForm" class="space-y-8">
            <!-- Step 1: Identity -->
            <div class="osint-card p-8 rounded-lg">
                <h2 class="text-[#00E5FF] font-bold text-lg mb-6 uppercase tracking-wider border-b border-[#00E5FF]/20 pb-2">I. Network Identity</h2>
                <div class="grid grid-cols-1 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase">Network Name</label>
                        <input type="text" id="networkName" required class="osint-input w-full p-3 rounded bg-black text-[#00E5FF]" placeholder="e.g. PanSahel Watch">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase">Network Description</label>
                        <textarea id="networkDescription" required class="osint-input w-full p-3 rounded bg-black text-[#00E5FF] h-24" placeholder="Brief overview of the organization's focus..."></textarea>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase">Mission Statement</label>
                            <input type="text" id="missionStatement" class="osint-input w-full p-3 rounded bg-black text-[#00E5FF]" placeholder="Primary objective...">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase">Region of Focus</label>
                            <input type="text" id="regionFocus" class="osint-input w-full p-3 rounded bg-black text-[#00E5FF]" placeholder="e.g. West Africa, Sahel...">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Step 2: Network Access -->
            <div class="osint-card p-8 rounded-lg">
                <h2 class="text-[#00E5FF] font-bold text-lg mb-6 uppercase tracking-wider border-b border-[#00E5FF]/20 pb-2">II. Network Access Control</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase">Network Privacy</label>
                        <select id="isPublic" class="osint-input w-full p-3 rounded bg-black text-[#00E5FF]">
                            <option value="true">PUBLIC - Open Enrollment</option>
                            <option value="false">PRIVATE - Access by Request</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Step 3: Branding -->
            <div class="osint-card p-8 rounded-lg">
                <h2 class="text-[#00E5FF] font-bold text-lg mb-6 uppercase tracking-wider border-b border-[#00E5FF]/20 pb-2">III. Branding & Aesthetics</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase">Network Logo (URL or Upload)</label>
                        <div class="flex gap-4">
                            <input type="text" id="logoUrl" class="osint-input flex-1 p-3 rounded bg-black text-[#00E5FF]" placeholder="https://...">
                            <input type="file" id="logoFile" accept="image/*" class="hidden">
                            <button type="button" onclick="document.getElementById('logoFile').click()" class="osint-button px-6 py-3 rounded text-[10px] font-bold uppercase">Upload File</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase">Dashboard Title</label>
                        <input type="text" id="dashboardTitle" class="osint-input w-full p-3 rounded bg-black text-[#00E5FF]" placeholder="e.g. PANSAHEL INTEL">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase">Footer Text</label>
                        <input type="text" id="footerText" class="osint-input w-full p-3 rounded bg-black text-[#00E5FF]" placeholder="© 2024 PanSahel Watch">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase">Accent Colour</label>
                        <input type="color" id="accentColor" value="#00E5FF" class="w-full h-12 rounded bg-black cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase">Secondary Colour</label>
                        <input type="color" id="secondaryColor" value="#7FFBFF" class="w-full h-12 rounded bg-black cursor-pointer">
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-4">
                <button type="button" onclick="window.location.href='networks.html'" class="px-8 py-4 rounded text-xs font-bold uppercase tracking-widest text-gray-500 hover:text-white transition-colors">Cancel</button>
                <button type="submit" id="submitBtn" class="osint-button px-12 py-4 rounded font-bold uppercase tracking-widest">Establish Network</button>
            </div>
        </form>

        <div id="statusMessage" class="hidden mt-8 p-4 rounded text-center font-mono uppercase text-sm"></div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/permissions.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/setup-network.js"></script>
</body>
</html>
