<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Network | AfroSINT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-[#0a0a0a] min-h-screen flex items-center justify-center p-4">
    <div class="watermark-bg"></div>
    <div class="radar-bg absolute inset-0 opacity-20 pointer-events-none"></div>

    <div class="osint-card w-full max-w-2xl p-8 rounded-lg relative z-10 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-[#00E5FF] tracking-widest uppercase">Select Intelligence Network</h1>
            <p class="text-gray-400 mt-2 text-xs uppercase">Choose an operational command to proceed</p>
        </div>

        <div id="yourNetworksSection" class="hidden mb-10">
            <h2 class="text-[#00E5FF] text-xs font-bold uppercase tracking-widest mb-4 border-b border-[#00E5FF]/20 pb-1">Your Operational Commands</h2>
            <div id="yourNetworkList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <div id="availableNetworksSection">
            <h2 class="text-gray-500 text-xs font-bold uppercase tracking-widest mb-4 border-b border-white/10 pb-1">Explore Intelligence Networks</h2>
            <div id="networkList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Networks will be loaded here -->
                <div class="col-span-full text-center py-10 text-[#00E5FF] animate-pulse font-mono">
                    SCANNING AVAILABLE NETWORKS...
                </div>
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-white/10 flex justify-between items-center">
            <button onclick="logoutUser()" class="text-gray-500 hover:text-white text-xs uppercase font-bold tracking-widest">Abort Mission (Logout)</button>
            <div id="fellowAction" class="hidden">
                 <a href="setup-network.html" class="osint-button px-4 py-2 rounded text-[10px] font-bold uppercase tracking-widest">Establish New Network</a>
            </div>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/permissions.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/networks.js"></script>
</body>
</html>
