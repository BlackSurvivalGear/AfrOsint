<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AfroSINT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-[#0a0a0a] min-h-screen flex items-center justify-center p-4">
    <div class="watermark-bg"></div>
    <div class="radar-bg absolute inset-0 opacity-20 pointer-events-none"></div>

    <div class="osint-card w-full max-w-md p-8 rounded-lg relative z-10 shadow-2xl">
        <div class="text-center mb-8">
            <img src="AFROSINT LOGO.png" alt="AfrOsint Logo" class="w-32 h-32 object-contain mx-auto mb-4">
            <h1 class="text-3xl font-bold text-[#00E5FF] tracking-widest uppercase">AfroSINT</h1>
            <p class="text-gray-400 mt-2 text-xs">INTELLIGENCE OPERATIONS CENTER</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-xs font-semibold text-[#00E5FF] mb-2 uppercase">Personnel Email</label>
                <input type="email" id="email" required class="osint-input w-full p-3 rounded bg-black text-[#00E5FF]" placeholder="j.doe@afrosint.int">
            </div>
            <div>
                <label class="block text-xs font-semibold text-[#00E5FF] mb-2 uppercase">Access Code</label>
                <input type="password" id="password" required class="osint-input w-full p-3 rounded bg-black text-[#00E5FF]" placeholder="••••••••">
            </div>

            <div class="flex items-center justify-between text-xs">
                <label class="flex items-center text-gray-400 cursor-pointer">
                    <input type="checkbox" id="rememberMe" class="mr-2 accent-[#00E5FF]"> Remember Me
                </label>
                <a href="#" id="forgotPassword" class="text-[#00E5FF] hover:underline">Forgot Access Code?</a>
            </div>

            <button type="submit" class="osint-button w-full py-3 rounded font-bold uppercase tracking-widest">Authorize Access</button>
        </form>

        <div class="mt-6 flex items-center justify-between">
            <span class="border-b border-gray-700 w-1/4"></span>
            <span class="text-xs text-gray-500 uppercase">External Authentication</span>
            <span class="border-b border-gray-700 w-1/4"></span>
        </div>

        <button id="googleLogin" class="mt-6 w-full py-3 border border-white/10 rounded flex items-center justify-center space-x-2 hover:bg-white/5 transition">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-5 h-5">
            <span class="text-sm">Sign in with Google</span>
        </button>

        <p class="mt-8 text-center text-xs text-gray-400">
            UNAUTHORIZED ACCESS IS PROHIBITED. <br>
            <a href="register.html" class="text-[#00E5FF] hover:underline">ENROLL NEW PERSONNEL</a>
        </p>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/permissions.js"></script>
    <script src="js/auth.js"></script>
    <script>
        checkAuthState();

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            loginUser(email, password, rememberMe);
        });

        document.getElementById('googleLogin').addEventListener('click', () => {
            loginWithGoogle();
        });

        document.getElementById('forgotPassword').addEventListener('click', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            if (!email) {
                alert("Please enter your email first.");
                return;
            }
            resetPassword(email);
        });
    </script>
</body>
</html>
