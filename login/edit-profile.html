<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | AfroSINT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-[#0a0a0a] min-h-screen text-gray-300">
    <div class="watermark-bg"></div>

    <main class="max-w-2xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
        <!-- Header -->
        <header class="mb-10 flex items-center justify-between">
            <h2 class="text-3xl font-bold text-white uppercase tracking-widest border-b-2 border-[#00E5FF] pb-2">Edit <span class="text-[#00E5FF]">Personnel</span> Profile</h2>
            <a href="dashboard.html" class="osint-button px-4 py-2 text-xs">Cancel</a>
        </header>

        <div class="osint-card p-8 rounded-lg">
            <form id="editProfileForm" onsubmit="saveProfileChanges(event)" class="space-y-6">
                <!-- Display Name -->
                <div>
                    <label for="editDisplayName" class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Display Name</label>
                    <input type="text" id="editDisplayName" required class="osint-input w-full px-4 py-3 rounded text-sm font-mono focus:ring-1 focus:ring-[#00E5FF]" placeholder="Enter your full name">
                </div>

                <!-- Nation -->
                <div>
                    <label for="editNation" class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Nation / Region</label>
                    <select id="editNation" required class="osint-input w-full px-4 py-3 rounded text-sm font-mono focus:ring-1 focus:ring-[#00E5FF]">
                        <option value="">Select Nation...</option>
                        <!-- Populated by JS -->
                    </select>
                </div>

                <!-- Profile Picture URL -->
                <div>
                    <label for="editPhotoURL" class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Profile Picture URL</label>
                    <input type="url" id="editPhotoURL" class="osint-input w-full px-4 py-3 rounded text-sm font-mono focus:ring-1 focus:ring-[#00E5FF]" placeholder="https://example.com/photo.jpg">
                    <p class="mt-2 text-[10px] text-gray-600 uppercase tracking-tight">Direct link to an image file (PNG, JPG, WEBP)</p>
                </div>

                <div class="pt-6 border-t border-[#00E5FF]/10 flex flex-col gap-4">
                    <button type="submit" id="saveProfileBtn" class="osint-button w-full px-6 py-4 rounded text-sm font-bold uppercase tracking-widest">
                        Save Changes
                    </button>
                    <div id="saveStatus" class="hidden text-center text-xs font-mono uppercase animate-pulse text-[#00E5FF]">
                        Synchronizing with Central Database...
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script src="js/firebase-config.js"></script>
    <script src="js/permissions.js"></script>
    <script src="js/nations-data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/edit-profile.js"></script>
</body>
</html>
